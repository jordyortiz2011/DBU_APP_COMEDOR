workflows:
  ios-unsigned:
    name: iOS IPA sin firmar
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events: []        # solo se lanza manualmente desde Codemagic
    scripts:
      - name: Dependencias Flutter
        script: flutter pub get
      - name: Pods de iOS
        script: |
          cd ios
          pod install --repo-update
      - name: Build iOS sin firma
        script: flutter build ios --release --no-codesign
      - name: Empaquetar .ipa
        script: |
          cd build/ios/iphoneos
          rm -rf Payload app-unsigned.ipa
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qr app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa
    artifacts:
      - build/ios/iphoneos/app-unsigned.ipa
