workflows:
  ios-unsigned:
    name: iOS IPA sin firmar
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events: []        # solo se lanza manualmente desde Codemagic
    scripts:
      - name: Dependencias Flutter
        script: flutter pub get
      # Sin paso de "pod install": el repo no versiona ios/Podfile. Lo genera
      # "flutter build ios", que tambien instala los pods (mobile_scanner aun
      # no soporta Swift Package Manager).
      - name: Build iOS sin firma
        script: flutter build ios --release --no-codesign
      - name: Empaquetar .ipa
        script: |
          cd build/ios/iphoneos
          rm -rf Payload app-unsigned.ipa
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qr app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa
    artifacts:
      - build/ios/iphoneos/app-unsigned.ipa
